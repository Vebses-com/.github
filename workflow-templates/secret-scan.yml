# Secret scan — runs gitleaks over the repository history on every push and pull request.
# GitHub's own secret scanning is not available for private repositories on the Free plan; this is the free stand-in.
name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so leaked-then-deleted secrets are found too

      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tgz gitleaks

      - name: Scan
        run: ./gitleaks git --redact --verbose --exit-code 1 .
